# Station: the local code and credentials this agent can dock to.
# A plugin being present under plugins/ does not execute it; only paths listed here are enabled.
plugins:
  - ./plugins/providers/xai
  - ./plugins/channels/telegram
  - ./plugins/tools/brave
  - ./plugins/tools/notes

# Optional. ChatGPT/Codex plugin directories (Agent Plugins format) whose skills and MCP servers
# this station may use. Data only; see plugins/README.md#bundles-chatgpt-and-codex-plugins.
# bundles:
#   - ./plugins/bundles/notion

channel: telegram
# Optional. durable resumes interrupted turns after a restart; see README.
# runtime: durable
