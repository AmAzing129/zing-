# Station: the local code and credentials this agent can dock to.
# A plugin being present under plugins/ does not execute it; only paths listed here are enabled.
plugins:
  - ./plugins/providers/deepseek
  - ./plugins/channels/telegram
  - ./plugins/tools/brave
  - ./plugins/tools/notes

channel: telegram
# Default: durable resumes interrupted turns after a restart; see README.
# Set legacy to opt into JSONL-only persistence instead.
runtime: durable
